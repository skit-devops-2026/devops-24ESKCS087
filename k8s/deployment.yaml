apiVersion: apps/v1
kind: Deployment
metadata:
  name: pupil-web
  labels:
    app: pupil-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pupil-web
  template:
    metadata:
      labels:
        app: pupil-web
    spec:
      containers:
        - name: web
          image: ghcr.io/skit-devops-2026/devops-24eskcs087:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi